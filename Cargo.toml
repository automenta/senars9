[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.7.10"
pest_derive = "2.7.10"

# For async traits
async-trait = "0.1"

# For serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For error handling
thiserror = "1.0"

# For async runtime
tokio = { version = "1", features = ["full"] }

# For langchain integration
langchain-rust = { git = "https://github.com/a-r-n-e/langchain-rust" }
dotenvy = "0.15"

# For WebSocket server
tokio-tungstenite = "0.23.1"
futures-util = "0.3"
url = "2.5.0"